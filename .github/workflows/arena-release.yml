name: arena-release

# Build the Arena's JSON from the registries and publish the site.
#
# The Arena is read-only (docs/adr/0004): it renders published results and never
# computes a score. This job is the only writer of `arena/web/data/*.json`, and
# it fails if a row would be rendered without its score decomposition — a
# leaderboard row showing only an aggregate is a design failure, not a display
# choice.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "arena/**"
      - "BioScience-Harness/registry/**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build and validate the Arena data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The arena scripts import bioagent, which needs the sibling kernel on
      # the path and the package installed. Installing it here rather than
      # relying on PYTHONPATH alone is what a developer does too.
      - run: python -m pip install --upgrade pip && pip install -e "BioScience-Harness[dev]"

      - name: Generate leaderboard JSON from the registries
        env:
          PYTHONPATH: BioScience-Harness/src:PSH-Harness/src
        run: |
          python scripts/build_arena_data.py \
            --registry BioScience-Harness/registry \
            --out arena/web/data

      - name: A score must never be rendered without its decomposition
        env:
          PYTHONPATH: BioScience-Harness/src:PSH-Harness/src
        run: python scripts/check_arena_data.py arena/web/data

      - name: No hidden benchmark content may reach a published page
        env:
          PYTHONPATH: BioScience-Harness/src:PSH-Harness/src
        run: python scripts/check_leakage.py --published arena/web/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: arena/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
