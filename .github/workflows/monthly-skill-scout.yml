name: monthly-skill-scout

# The plan's cadence: 10:00 Beijing time on the 1st, which is 02:00 UTC.
#
# What this job may do, and what it may not:
#
#   it MAY  discover sources, audit candidates, score them, build a candidate
#           report and open a pull request with it
#   it MAY NOT promote anything into the stable registry, and it may not touch a
#           frozen benchmark Season
#
# That is not a convention here — `Registry.promote` is the only writer of a
# stable entry and it requires a `PromotionDecision` naming a human. A scheduled
# job would have to forge one, and `PromotionDecision` refuses to accept an empty
# `decided_by`. See docs/adr/0001.

on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scout:
    name: Discover, audit and score candidate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e "BioScience-Harness[dev]"

      - name: Run the scout over the declared sources
        working-directory: BioScience-Harness
        env:
          PYTHONPATH: src:../PSH-Harness/src
        run: |
          python -m bioagent.cli scout \
            --sources registry/skill_sources.yaml \
            --skills skills \
            --out candidate-report.json

      - name: Refuse the run if any candidate could reach production unreviewed
        working-directory: BioScience-Harness
        run: python scripts/check_no_autopromotion.py candidate-report.json

      - name: Open a pull request with the candidate report
        uses: peter-evans/create-pull-request@v6
        with:
          branch: scout/candidates-${{ github.run_id }}
          title: "Candidate skills: monthly scout run"
          commit-message: |
            Record the monthly candidate scan

            Candidates only. Nothing here is promoted: the stable registry
            changes only through a reviewed PromotionDecision.
          body: |
            Monthly candidate scan. **Nothing in this pull request is active.**

            Reviewing this means reading `candidate-report.json`:
            which skills were found, which were eliminated and by which code,
            and how the rest scored. Promoting one is a separate, attributed
            decision — see `docs/adr/0001`.

            Candidates eliminated by a hard condition are listed with the
            condition, not omitted. They are the backlog, and hiding them would
            make the pipeline look healthier than it is.
          add-paths: |
            BioScience-Harness/candidate-report.json
          delete-branch: true
