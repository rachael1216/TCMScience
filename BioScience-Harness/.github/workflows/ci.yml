name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The suite as a contributor runs it: source checkout, editable install.
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Unit tier (no data lake, no network)
        run: python -m pytest -q -m unit

  # Release hygiene: the checks that would have caught the v2.1 packaging defects.
  release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The gate imports every declared package, so the runtime dependencies
      # have to be present or every import fails for the wrong reason.
      - run: pip install -e .
      - name: Refuse sidecars, unparsable sources, untracked or unimportable modules
        run: python scripts/make_release.py --check

  # The check the source-checkout suite structurally cannot make: does the
  # artifact we would publish work once installed, away from the repository?
  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build
      - run: pip install -e .
      - name: Build and verify sdist + wheel
        run: python scripts/make_release.py --outdir dist
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install --upgrade pip
          /tmp/wheelenv/bin/pip install dist/*.whl pytest
      - name: Load the catalogue from the installed package, outside the checkout
        working-directory: /tmp
        run: |
          /tmp/wheelenv/bin/python - <<'PY'
          from pathlib import Path

          import bioagent
          from bioagent import CapabilityRegistry
          from bioagent.config import catalogue_path

          path = catalogue_path()
          pkg = Path(bioagent.__file__).resolve().parent
          assert path.exists(), f"packaged catalogue missing: {path}"
          assert pkg in path.parents, f"{path} is outside the installed package"
          registry = CapabilityRegistry.from_csv(path)
          assert len(registry) > 1000, f"only {len(registry)} capabilities loaded"
          print(f"installed wheel exposes {len(registry)} capabilities from {path}")
          PY
      - name: Run the unit tier against the installed package
        run: /tmp/wheelenv/bin/python -m pytest -q -m unit tests

  # The policy kernel has its own job so a security regression is never buried
  # in a broad red run.
  trusted-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Policy, capability and lineage regressions
        run: python -m pytest -q tests/test_v22_trusted_core.py tests/test_v21_regressions.py
